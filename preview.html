<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Securely preview your custom web development and Android app projects built by Auzent.">
    
    <title>Live Project Preview | Auzent - Web & App Development</title>
    
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0F172A; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
        
        #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; z-index: 10; background: #0F172A; }
        
        .spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #38BDF8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* This overlay prevents users from easily inspecting or copying elements over the preview */
        .security-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 9999; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.03), rgba(0,0,0,0.03) 1px, transparent 1px, transparent 2px); }
        
        .watermark { position: fixed; bottom: 10px; right: 15px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.2); z-index: 9998; pointer-events: none; text-transform: uppercase;}
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="security-overlay"></div>
    <div class="watermark">Auzent Live Preview</div>
    
    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text" style="font-size: 12px; font-weight: 700; color: #94A3B8; letter-spacing: 1px; text-transform: uppercase;">Loading Your Custom Project...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script> 
    
    <script>
        // Prevent right-click to protect your project assets
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Prevent common keyboard shortcuts used to open Developer Tools
        document.addEventListener('keydown', e => {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && ['I','C','J'].includes(String.fromCharCode(e.keyCode))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                e.preventDefault();
                return false;
            }
        });

        // Disable console logs to keep the backend clean and secure
        console.log = console.warn = console.error = console.info = function() {};
        window.alert = window.confirm = window.prompt = function() { return false; };

        // A simple security check: if someone forces DevTools open, this hides the preview
        setInterval(() => {
            const before = new Date().getTime();
            debugger; 
            const after = new Date().getTime();
            if (after - before > 100) {
                document.body.innerHTML = "<h1 style='color:#EF4444; font-family:monospace; text-align:center; margin-top:40vh; letter-spacing: 1px;'>PREVIEW CLOSED FOR SECURITY.</h1>";
            }
        }, 1500);
        
        const urlParams = new URLSearchParams(window.location.search);
        const workspaceId = urlParams.get('id');
        const loaderText = document.getElementById('loader-text');

        // Fetch the project link securely from the database
        if(workspaceId) {
            db.collection('auzent_gateways').doc(workspaceId).get().then(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    // Only show the preview if the admin has enabled it and provided a link
                    if(data.is_preview_active && data.tunnel_url) {
                        const frame = document.createElement('iframe');
                        frame.style.cssText = "width: 100%; height: 100%; border: none; z-index: 1; position: absolute; top: 0; left: 0; background: #fff;";
                        frame.setAttribute("sandbox", "allow-same-origin allow-scripts allow-forms allow-popups");
                        frame.src = data.tunnel_url;
                        document.body.appendChild(frame);

                        frame.onload = () => { document.getElementById('loader').style.display = 'none'; };
                        setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 4000);
                    } else {
                        loaderText.innerHTML = '<span style="color: #EF4444;">Preview is currently turned off by the Auzent team.</span>';
                        document.querySelector('.spinner').style.display = 'none';
                    }
                } else {
                    loaderText.innerHTML = '<span style="color: #EF4444;">We couldn\'t find a project with this ID.</span>';
                    document.querySelector('.spinner').style.display = 'none';
                }
            }).catch(e => {
                loaderText.innerHTML = '<span style="color: #EF4444;">Connection Error. Please try refreshing the page.</span>';
                document.querySelector('.spinner').style.display = 'none';
            });
        } else {
            loaderText.innerHTML = '<span style="color: #EF4444;">No Project ID was found.</span>';
            document.querySelector('.spinner').style.display = 'none';
        }
    </script>
</body>
</html>
